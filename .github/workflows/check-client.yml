name: Check browser-game JavaScript
on:
  push:
    paths:
      - 'index.html'
      - 'mini-games.js'
      - 'mini-games.css'
      - '.github/workflows/check-client.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check mini-games.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('index.html', 'utf8');
          const blocks = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m => m[1].trim()).filter(Boolean);
          for (const script of blocks) new vm.Script(script);
          if (!html.includes('mini-games.js?v=09') || !html.includes('mini-games.css?v=09')) throw new Error('Missing minigame assets');
          for (const key of ['OPEN','PATH','GLASS','MIRROR','ORIGIN']) {
            if (!html.includes('"'+key+'"')) throw new Error('Missing stage '+key);
          }
          const games = fs.readFileSync('mini-games.js', 'utf8');
          for (const expected of ['function moveFree(piece,dx,dy)', 'function shiftAxis(piece,axis,delta)', 'function endDrag(e,cancelled)']) {
            if (!games.includes(expected)) throw new Error('Missing continuous-drag feature: '+expected);
          }
          if (games.includes('Math.round(distance/cell)')) throw new Error('Old grid snapping still present');
          console.log('Syntax, assets and free-form movement checks passed');
          NODE
