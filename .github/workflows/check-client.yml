name: Check browser-game JavaScript
on:
  push:
    paths:
      - 'index.html'
      - 'mini-games.js'
      - 'mini-games.css'
      - 'tests/box-physics.test.mjs'
      - 'tests/box-layout.test.mjs'
      - 'tests/box-secret.test.mjs'
      - '.github/workflows/check-client.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check mini-games.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('index.html', 'utf8');
          const blocks = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m => m[1].trim()).filter(Boolean);
          for (const script of blocks) new vm.Script(script);
          if (!html.includes('mini-games.js?v=15') || !html.includes('mini-games.css?v=15')) throw new Error('Missing minigame assets');
          for (const key of ['OPEN','PATH','GLASS','MIRROR','ORIGIN']) {
            if (!html.includes('"'+key+'"')) throw new Error('Missing stage '+key);
          }
          const games = fs.readFileSync('mini-games.js', 'utf8');
          for (const expected of ['function moveFree(piece,dx,dy,ctx)', 'function shiftAxis(piece,axis,delta,ctx)', 'function endDrag(e,cancelled)']) {
            if (!games.includes(expected)) throw new Error('Missing continuous-drag feature: '+expected);
          }
          if (games.includes('Math.round(distance/cell)')) throw new Error('Old grid snapping still present');
          if (!games.includes('INSET=0.01') || !games.includes('w:p[3]-2*INSET')) throw new Error('Missing physical block clearance');
          if (!games.includes('piece.y+piece.h>=H-INSET-0.05')) throw new Error('Win check not adjusted for clearance');
          if (games.includes('["1f",3,2,1,1]')) throw new Error('Stage 2 remains overcrowded');
          if (!games.includes('PUSH_LIMIT=0.35') || !games.includes('function gentlyPush(')) {
            throw new Error('Missing gentle push collision handling');
          }
          if (games.includes('if(!cancelled)dragMove(e);')) throw new Error('Pointerup still shifts piece');
          console.log('Syntax, assets and free-form movement checks passed');
          NODE
      - name: Regression test dragging and collision response
        run: node tests/box-physics.test.mjs
      - name: Verify all three levels are solvable with two empty cells
        run: node tests/box-layout.test.mjs
      - name: Verify hidden HP tap-count easter egg
        run: node tests/box-secret.test.mjs
