name: Check browser-game JavaScript
on:
  push:
    paths:
      - 'index.html'
      - 'mini-games.js'
      - 'mini-games.css'
      - '.github/workflows/check-client.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check mini-games.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('index.html', 'utf8');
          const blocks = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m => m[1].trim()).filter(Boolean);
          for (const script of blocks) new vm.Script(script);
          if (!html.includes('mini-games.js?v=08') || !html.includes('mini-games.css?v=08')) throw new Error('Missing minigame assets');
          for (const key of ['OPEN','PATH','GLASS','MIRROR','ORIGIN']) {
            if (!html.includes('"'+key+'"')) throw new Error('Missing stage '+key);
          }
          console.log('Syntax and asset checks passed');
          NODE
